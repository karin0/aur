name: Sync AUR packages

on:
  schedule:
    - cron: '0 6,14,22 * * *'
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      profile:
        description: 'Profile to build'
        type: choice
        options:
          - all
          - generic
          - alderlake
          - tremont
          - znver5
        default: all

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ matrix.profile }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ (github.event.inputs.profile == 'all' || !github.event.inputs.profile) && fromJSON('["generic", "alderlake", "tremont", "znver5"]') || fromJSON(format('["{0}"]', github.event.inputs.profile)) }}

    steps:
      - uses: actions/checkout@v6

      - name: Cleanup pre-installed tools
        shell: bash
        run: |
          shopt -s nullglob
          sudo rm -rf /usr/share/{dotnet,swift,az*,gradle*,*conda} \
            /opt/{ghc,az} \
            /usr/local/share/boost /usr/local/graalvm /usr/local/julia* "$AGENT_TOOLSDIRECTORY"

      - uses: karin0/auv@main
        with:
          profile: ${{ matrix.profile }}
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg_key_id: ${{ secrets.GPG_KEY_ID }}
          telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
